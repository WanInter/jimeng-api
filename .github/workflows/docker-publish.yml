name: Docker Publish

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "configs/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (for example, 1.14.0; defaults to the UTC build date)"
        required: false
        type: string
        default: ""

concurrency:
  group: docker-publish-${{ github.ref_name }}-${{ inputs.version || 'daily' }}
  cancel-in-progress: true

permissions: {}

env:
  IMAGE_NAME: ghcr.io/waninter/jimeng-api
  ROLLING_TAG: latest

jobs:
  build:
    name: Build and push Docker image
    runs-on: waninter-runner
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image_ref.outputs.image }}
      digest: ${{ steps.image_ref.outputs.digest }}

    steps:
      - name: Validate manual trigger ref
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "${WORKFLOW_REF}" != "refs/heads/main" ]; then
            echo "Manual image builds must be run from the main branch" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image version
        id: image_version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_VERSION}" ]; then
            APP_VERSION="${REQUESTED_VERSION#v}"
          else
            APP_VERSION="$(date -u +%Y%m%d)"
          fi
          case "${APP_VERSION}" in
            *[!0-9A-Za-z._-]*|'')
              echo "Invalid application version: ${APP_VERSION}" >&2
              exit 1
              ;;
          esac
          # Docker tags are limited to 128 characters.
          if [ "${#APP_VERSION}" -gt 128 ]; then
            echo "Application version is too long (maximum 128 characters)" >&2
            exit 1
          fi
          COMMIT="$(git rev-parse HEAD)"
          {
            printf 'app_version=%s\n' "${APP_VERSION}"
            printf 'commit=%s\n' "${COMMIT}"
          } >> "$GITHUB_OUTPUT"
          printf 'Application version: %s\n' "${APP_VERSION}"
          printf 'Source commit: %s\n' "${COMMIT}"

      - name: Extract metadata labels
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.ROLLING_TAG }}
            type=raw,value=${{ steps.image_version.outputs.app_version }}
          labels: |
            org.opencontainers.image.version=${{ steps.image_version.outputs.app_version }}
            org.opencontainers.image.revision=${{ steps.image_version.outputs.commit }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.image_version.outputs.app_version }}
          cache-from: type=gha,scope=jimeng-api-push-main
          cache-to: type=gha,scope=jimeng-api-push-main,mode=max
          provenance: false
          sbom: false

      - name: Set image reference
        id: image_ref
        env:
          IMAGE_NAME_VALUE: ${{ env.IMAGE_NAME }}
          ROLLING_TAG_VALUE: ${{ env.ROLLING_TAG }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "${BUILD_DIGEST}" =~ ^sha256:[0-9a-fA-F]{64}$ ]]; then
            echo "Build did not return a valid image digest" >&2
            exit 1
          fi
          IMAGE_REF="${IMAGE_NAME_VALUE}:${ROLLING_TAG_VALUE}@${BUILD_DIGEST}"
          printf 'image=%s\n' "${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "${BUILD_DIGEST}" >> "$GITHUB_OUTPUT"
          printf 'Image: %s\n' "${IMAGE_REF}"
