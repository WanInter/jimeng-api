apiVersion: apps/v1
kind: Deployment
metadata:
  name: jimeng-api
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: jimeng-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jimeng-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jimeng-api
    spec:
      __IMAGE_PULL_SECRETS__
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: jimeng-api
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5100
          envFrom:
            - configMapRef:
                name: jimeng-api-config
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jimeng-api-data
